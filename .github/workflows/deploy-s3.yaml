name: Deploy to S3

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master

      - name: Install Node.js and npm
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.API_URL }}
          REACT_APP_RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload folder to bucket
        run: |
          destination="s3://${S3_BUCKET}"
          if [ -n "${S3_KEY%/}" ]; then
            destination="$destination/${S3_KEY%/}"
          fi
          aws s3 cp build/ "$destination/" --recursive --acl public-read \
            --exclude '*.log' --exclude '_headers' --exclude 'index.html' --exclude 'version.json'
          aws s3 cp build/index.html "$destination/index.html" --acl public-read --cache-control 'no-cache'
          aws s3 cp build/version.json "$destination/version.json" --acl public-read --cache-control 'no-store'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          S3_KEY: ${{ secrets.S3_KEY }}
